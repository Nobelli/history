<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>世界知识检索</title>
<meta name="description" content="一键搜索世界历史事件、冷知识、文化习俗：内置知识库，可选接入维基百科实时检索。">
<style>
  :root{
    --bgc:#f5f3ee;
    --scrim:rgba(245,243,238,.55);
    --fg:#20201e;
    --muted:#6c6a64;
    --card:rgba(255,255,255,.74);
    --card-solid:#fff;
    --line:rgba(0,0,0,.10);
    --accent:#2f6f64;
    --accentfg:#fff;
    --panel:rgba(255,255,255,.97);
    --radius:12px;
  }
  html.dark{
    --fg:#ecebe6;
    --muted:#a3a09a;
    --card:rgba(26,26,25,.62);
    --card-solid:#1b1b1a;
    --line:rgba(255,255,255,.12);
    --panel:rgba(24,24,23,.97);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--fg);
    background:var(--bgc);
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  #bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat}
  #scrim{position:fixed;inset:0;z-index:1;background:var(--scrim);pointer-events:none}
  .wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:34px 20px 72px}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
  header > div{min-width:0}
  h1{font-size:22px;line-height:1.3;margin:0 0 4px;letter-spacing:.02em;font-weight:650}
  #sub{margin:0;font-size:12.5px;color:var(--muted)}

  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  .primary{
    background:var(--accent);color:var(--accentfg);border-radius:10px;
    padding:10px 20px;font-size:14.5px;font-weight:600;white-space:nowrap;
    transition:filter .15s;
  }
  .primary:hover{filter:brightness(1.08)}
  .ghost{
    border:1px solid var(--line);background:var(--card);border-radius:9px;
    padding:8px 14px;font-size:13.5px;color:var(--muted);white-space:nowrap;flex:0 0 auto;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .ghost:hover{color:var(--fg)}

  .searchrow{display:flex;gap:10px;align-items:stretch}
  #q{
    flex:1;min-width:0;font:inherit;color:var(--fg);
    background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:12px 15px;outline:none;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  #q::placeholder{color:var(--muted);opacity:.85}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
  .chip{
    font-size:12.5px;padding:5px 12px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);background:var(--card);
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accentfg)}

  .tabs{display:flex;gap:18px;margin:20px 0 6px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 2px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--fg);border-bottom-color:var(--accent)}
  .tab .n{font-size:12px;opacity:.7}

  .meta{font-size:12.5px;color:var(--muted)}
  .metalines{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 10px;min-height:20px}
  .minilink{font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:1px}
  .minilink:hover{color:var(--accent);border-color:var(--accent)}
  .more{
    margin-top:4px;padding:12px;border:1px dashed var(--line);border-radius:var(--radius);
    color:var(--muted);font-size:13.5px;background:var(--card);
  }
  .more:hover{color:var(--accent);border-color:var(--accent)}

  #list{display:flex;flex-direction:column;gap:9px}
  .card{
    display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:start;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 15px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .yr{
    font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:650;color:var(--accent);
    padding-top:2px;letter-spacing:.01em;
  }
  html.dark .yr{color:color-mix(in srgb,var(--accent) 65%,#fff)}
  .card h3{margin:0 0 3px;font-size:15.5px;font-weight:600;line-height:1.45;cursor:pointer}
  .card h3:hover{color:var(--accent)}
  html.dark .card h3:hover{color:color-mix(in srgb,var(--accent) 65%,#fff)}
  .card p{margin:0;font-size:13.5px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .tag.c{border-color:transparent;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
  .tag.note{border-color:transparent;background:color-mix(in srgb,#c9a227 18%,transparent);color:#8a6d12}
  .tag.ext{border-color:transparent;background:color-mix(in srgb,#3b6fb6 16%,transparent);color:#3b6fb6}
  .tag.doubt{border-color:transparent;background:color-mix(in srgb,#c08a12 22%,transparent);color:#8a6d12}
  html.dark .tag.doubt{color:#e0bb63}
  .yr.kind{font-size:12px;font-weight:600;letter-spacing:.04em}
  .yr.k-f{color:#3b6fb6}
  .yr.k-r{color:#a8801f}
  .yr.k-c{color:#7b52a0}
  html.dark .yr.k-f{color:#7fa9e0}
  html.dark .yr.k-r{color:#e0bb63}
  html.dark .yr.k-c{color:#b28dd6}
  .tag.k-f,.tag.k-c{border-color:transparent}
  .tag.k-f{background:color-mix(in srgb,#3b6fb6 14%,transparent);color:#3b6fb6}
  .tag.k-c{background:color-mix(in srgb,#7b52a0 14%,transparent);color:#7b52a0}
  .tag.k-r{background:color-mix(in srgb,#c08a12 20%,transparent);color:#8a6d12}
  .banner{
    font-size:13px;line-height:1.7;color:#7c5f14;background:color-mix(in srgb,#c08a12 14%,transparent);
    border:1px solid color-mix(in srgb,#c08a12 28%,transparent);border-radius:10px;
    padding:10px 13px;margin:0 0 18px;
  }
  html.dark .banner{color:#e6c477}
  .secs{margin:0 0 8px}
  .sec h4{
    margin:20px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.06em;
    color:var(--accent);
  }
  .sec p{margin:0;font-size:14px;line-height:1.85}
  .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .mini{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:4px 9px;white-space:nowrap}
  .mini:hover{color:var(--fg);border-color:var(--accent)}
  .mini.on{color:var(--accent);border-color:var(--accent)}

  .empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px;
    border:1px dashed var(--line);border-radius:var(--radius);background:var(--card)}
  .empty a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}

  #extsec{margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
  .sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
  .sechead h2{font-size:14px;margin:0;font-weight:600;color:var(--muted);letter-spacing:.04em}
  #extlist{display:flex;flex-direction:column;gap:9px}
  .extcard{grid-template-columns:1fr auto}
  .extcard .src{font-size:11.5px;color:var(--muted);margin-top:6px}
  .extcard a{color:var(--accent);text-decoration:none}
  .skeleton{height:64px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);opacity:.6}

  footer{margin-top:46px;font-size:12px;color:var(--muted);line-height:1.9;border-top:1px solid var(--line);padding-top:14px}
  footer code{font-size:11.5px;background:color-mix(in srgb,var(--fg) 7%,transparent);padding:1px 5px;border-radius:4px}

  /* drawer */
  #mask{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s}
  body.open #mask{opacity:1;pointer-events:auto}
  #drawer{
    position:fixed;z-index:9;top:0;right:0;bottom:0;width:min(440px,94vw);
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(103%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    overflow:auto;padding:22px 22px 40px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }
  body.open #drawer{transform:none}
  .dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
  .dhead h2{font-size:16px;margin:0;font-weight:600}
  .close{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 11px}
  .close:hover{color:var(--fg)}
  .field{margin-bottom:20px}
  .field > label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.02em}
  .field .hint{font-size:11.5px;color:var(--muted);opacity:.85;margin-top:6px;line-height:1.6}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type=color]{
    width:44px;height:34px;padding:0;border:1px solid var(--line);border-radius:9px;
    background:none;cursor:pointer;appearance:none;-webkit-appearance:none;overflow:hidden;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
  input[type=text],input[type=url],select,textarea{
    font:inherit;color:var(--fg);background:var(--card-solid);
    border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none;width:100%;
  }
  html.dark input[type=text],html.dark input[type=url],html.dark select,html.dark textarea{background:rgba(255,255,255,.06)}
  textarea{resize:vertical;min-height:110px;line-height:1.7;font-size:14px}
  select{width:auto}
  input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
  /* 自绘滑块：不依赖原生 range 的命中区域，避免坐标错位 */
  .slider{
    position:relative;height:32px;margin:4px 0 0;cursor:pointer;
    touch-action:none;-webkit-user-select:none;user-select:none;outline:none;
  }
  .slider:focus-visible .slider-knob{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
  .slider-rail{
    position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);
    background:color-mix(in srgb,var(--fg) 14%,transparent);border-radius:999px;overflow:hidden;
  }
  .slider-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .05s linear}
  .slider-knob{
    position:absolute;top:50%;width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:2px solid var(--card-solid);
    transform:translate(-50%,-50%);pointer-events:none;
    box-shadow:0 1px 4px rgba(0,0,0,.22);transition:left .05s linear;
  }
  .slider-marks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);opacity:.7;margin-top:-2px}
  .swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}
  .sw.on{outline:2px solid var(--accent);outline-offset:2px}
  .btn{font-size:13px;border:1px solid var(--line);border-radius:9px;padding:8px 14px;color:var(--fg);background:var(--card-solid)}
  html.dark .btn{background:rgba(255,255,255,.06)}
  .btn:hover{border-color:var(--accent)}
  .btn.solid{background:var(--accent);color:var(--accentfg);border-color:var(--accent);font-weight:600}
  pre{white-space:pre-wrap;word-break:break-all;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:color-mix(in srgb,var(--fg) 6%,transparent);border:1px solid var(--line);
    border-radius:9px;padding:11px;margin:9px 0 0;color:var(--muted);max-height:220px;overflow:auto}
  .kw{display:flex;align-items:center;gap:9px;font-size:14px}
  .kw input{accent-color:var(--accent);width:16px;height:16px}
  .dtitle{font-size:19px;line-height:1.4;margin:0 0 6px;font-weight:650}
  .dmeta{font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .dbody{font-size:14px;line-height:1.85;margin-bottom:20px}
  .dbody a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
  hr{border:0;border-top:1px solid var(--line);margin:22px 0}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);z-index:20;
    background:var(--accent);color:var(--accentfg);font-size:13px;padding:9px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.22s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:600px){
    .wrap{padding:22px 14px 60px}
    h1{font-size:19px}
    .card{grid-template-columns:1fr;gap:8px;padding:12px 13px}
    .yr{font-size:12.5px;padding-top:0}
    .acts{flex-direction:row;justify-content:flex-start}
    .primary{padding:10px 14px}
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="scrim"></div>

<div class="wrap">
  <header>
    <div>
      <h1>世界知识检索</h1>
      <p id="sub">共 <span id="seedcount">0</span> 条内容</p>
    </div>
    <button class="ghost" id="btnSet">设置</button>
  </header>

  <div class="searchrow">
    <input id="q" type="search" placeholder="输入搜索" autocomplete="off" spellcheck="false">
    <button class="primary" id="btnSearch">搜索</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="tabs">
    <button class="tab on" data-view="all">全部</button>
    <button class="tab" data-view="fav">收藏 <span class="n" id="favn">0</span></button>
  </div>

  <div class="metalines">
    <div id="meta" class="meta"></div>
    <button class="minilink" id="sortBtn">按重要度</button>
  </div>
  <div id="list"></div>

  <section id="extsec" hidden>
    <div class="sechead">
      <h2>站外检索（维基百科）</h2>
      <span class="meta" id="extmeta"></span>
    </div>
    <div id="extlist"></div>
  </section>

  <footer>
    收藏、笔记、背景设置保存在 <code>localStorage</code>本地保存，换设备请用设置里的「导出 JSON」。<br>
    电脑快捷键：<code>/</code> 聚焦搜索框，<code>Esc</code> 关闭面板。
  </footer>
</div>

<div id="mask"></div>
<aside id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
/* ---------- 1. 内置事件库（精选，离线可用） ---------- */
const RAW = [
  // —— 中国 ——

  [1206,null,"蒙古帝国建立","成吉思汗统一草原各部，开启横跨欧亚的扩张。","政治","中国","蒙古帝国"],
  [1279,null,"元朝统一全国","崖山海战，元灭南宋，中国首次由北方游牧政权统一。","政治","中国","元朝"],

  [1662,null,"郑成功收复台湾","驱逐荷兰东印度公司殖民者，台湾重归中国政权。","战争","中国","郑成功"],
  [1689,null,"中俄尼布楚条约","划定东段边界，清朝与俄国首次正式划界。","政治","中国","尼布楚条约"],
  [1793,null,"马戛尔尼使华","礼仪与贸易冲突显现，中西体系性矛盾浮出水面。","政治","中国","马戛尔尼使团"],

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtY(y,e){
  if(y==null||y==='') return '—';
  const f=v=>v<0?'前'+Math.abs(v):String(v);
  return (e!=null&&e!==y) ? f(y)+'–'+f(e) : f(y);
}
function hex2rgb(h){
  h=(h||'').replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);
  return [ (n>>16)&255, (n>>8)&255, n&255 ];
}
let toastT=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

function applyTheme(){
  const [r,g,b]=hex2rgb(S.bgColor);
  const L=(0.2126*r+0.7152*g+0.0722*b)/255;
  const dark=L<0.5;
  const root=document.documentElement;
  root.style.setProperty('--bgc',`rgb(${r},${g},${b})`);
  root.style.setProperty('--scrim',`rgba(${r},${g},${b},${S.scrim})`);
  root.style.setProperty('--accent',S.accent||'#2f6f64');
  root.classList.toggle('dark',dark);
  const bg=$('#bg');
  bg.style.backgroundImage = S.bgImage ? 'url("'+S.bgImage+'")' : 'none';
}

/* ---------- 5. 检索 ---------- */
function tokens(q){ return q.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function scoreOf(it,tks){
  const t=(it.t||'').toLowerCase(), st=it.st||t, y=String(it.y==null?'':it.y);
  let sc=0;
  for(const tk of tks){
    if(t.includes(tk)) sc+=100;
    else if(y.includes(tk)) sc+=40;
    else if(st.includes(tk)) sc+=28;
    else return -1;
  }
  return sc + Math.max(0,26-t.length);
}
function localResults(){
  let arr = VIEW==='fav' ? FAVS.slice() : ALL;
  if(CAT!=='全部') arr = (CAT==='存疑') ? arr.filter(x=>x.kind==='r') : arr.filter(x=>x.c===CAT);
  const q=Q.trim();
  if(!q){
    arr = arr.slice();
    if(SORT==='imp') arr.sort((a,b)=>(b.n||0)-(a.n||0) || ((a.y==null?9e9:a.y)-(b.y==null?9e9:b.y)));
    else arr.sort((a,b)=>(a.y==null?9e9:a.y)-(b.y==null?9e9:b.y) || (b.n||0)-(a.n||0));
    return arr;
  }
  const tks=tokens(q);
  return arr.map(x=>({x, s:scoreOf(x,tks)})).filter(o=>o.s>=0)
            .sort((a,b)=> b.s-a.s || (b.x.n||0)-(a.x.n||0)
              || ((a.x.y==null?9e9:a.x.y)-(b.x.y==null?9e9:b.x.y)))
            .map(o=>o.x);
}

function kindLabel(it){
  return it.kind==='r' ? '存疑' : it.kind==='c' ? '习俗' : it.kind==='f' ? '小知识' : '';
}
function cardHTML(it,isFav){
  const d = FAVS.some(f=>f.id===it.id);
  const left = (it.y!=null)
    ? `<div class="yr">${fmtY(it.y,it.e)}</div>`
    : `<div class="yr kind k-${it.kind||'f'}">${kindLabel(it)||(it.ext?'站外':'—')}</div>`;
  return `<article class="card" data-id="${esc(it.id)}">
    ${left}
    <div>
      <h3 data-act="open">${esc(it.t)}</h3>
      <p>${esc(it.s||'')}</p>
      <div class="tags">
        ${it.c?`<span class="tag c">${esc(it.c)}</span>`:''}
        ${(it.tg||[]).filter(t=>t!==it.c).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
        ${it.r?`<span class="tag">${esc(it.r)}</span>`:''}
        ${it.ext?'<span class="tag ext">站外</span>':''}
        ${NOTES[it.id]?'<span class="tag note">有笔记</span>':''}
      </div>
    </div>
    <div class="acts">
      <button class="mini${d?' on':''}" data-act="fav">${d?'已收藏':'收藏'}</button>
      ${isFav?'<button class="mini" data-act="del">移除</button>':'<button class="mini" data-act="open">详情</button>'}
    </div>
  </article>`;
}

function wikiURL(lang,q){
  const p=new URLSearchParams({
    action:'query', format:'json', origin:'*', utf8:'1',
    generator:'search', gsrsearch:q, gsrlimit:'8', gsrnamespace:'0',
    prop:'extracts|info', exintro:'1', explaintext:'1', exlimit:'max', inprop:'url'
  });
  return `https://${lang}.wikipedia.org/w/api.php?`+p.toString();
}
function withProxy(url){
  if(!S.proxy) return url;
  return S.proxy.includes('{url}')
    ? S.proxy.replace('{url}', encodeURIComponent(url))
    : S.proxy.replace(/\/?$/,'/') + encodeURIComponent(url);
}
function parseYear(text){
  const m=(text||'').match(/(公元前)?\s?(\d{3,4})\s?年/);
  if(!m) return null;
  const n=parseInt(m[2],10);
  if(n<1000 && !m[1]) return null;
  return m[1] ? -n : n;
}
async function remoteSearch(q){
  if(!S.external || !q.trim()) return;
  if(ctrl) ctrl.abort();
  ctrl=new AbortController();
  extBusy=true; extErr=''; extItems=[]; extQ=q.trim(); renderExt();
  const langs = S.lang==='both'?['zh','en']:[S.lang];
  const out=[];
  try{
    for(const lang of langs){
      const url=withProxy(wikiURL(lang,q));
      const timer=setTimeout(()=>ctrl&&ctrl.abort(), 12000);
      let data;
      try{
        const r=await fetch(url,{signal:ctrl.signal});
        if(!r.ok) throw new Error('HTTP '+r.status);
        data=await r.json();
      } finally { clearTimeout(timer); }
      const pages=data&&data.query&&data.query.pages?data.query.pages:{};
      Object.values(pages)
        .sort((a,b)=>(a.index||99)-(b.index||99))
        .forEach(p=>{
          const ex=(p.extract||'').replace(/\s+/g,' ').trim();
          if(!ex) return;
          out.push({
            id:'w:'+lang+':'+p.title, t:p.title,
            s: ex.length>230 ? ex.slice(0,230)+'…' : ex,
            y: parseYear(ex), e:null, c:'', r: lang==='zh'?'维基中文':'Wikipedia',
            w:p.title, ext:true, lang,
            url: p.fullurl || `https://${lang}.wikipedia.org/wiki/`+encodeURIComponent(p.title)
          });
        });
    }
    extItems=out.slice(0,12);
  }catch(e){
    extErr = e.name==='AbortError' ? '请求超时或被中断' : ('请求失败：'+e.message);
  }finally{
    extBusy=false; renderExt();
  }
}
function renderExt(){
  const sec=$('#extsec');
  const show = VIEW==='all' && S.external && Q.trim().length>0;
  sec.hidden=!show;
  if(!show) return;
  const meta=$('#extmeta'), box=$('#extlist');
  if(extBusy){
    meta.textContent='检索中…';
    box.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';
    return;
  }
  if(extErr){
    meta.textContent='';
    box.innerHTML=`<div class="empty">${esc(extErr)}<br>
      维基百科需要能访问外网。国内网络可到 <a href="#" data-act="openset">设置</a> 里填一个中转地址（Cloudflare Worker，代码已内置，可直接复制）。</div>`;
    return;
  }
  if(!extItems.length){
    meta.textContent='';
    box.innerHTML = extQ===Q.trim()
      ? '<div class="empty">站外没有找到相关条目，换个关键词试试。</div>'
      : '<div class="empty">按回车键同时检索维基百科（结果会显示在这里）。</div>';
    return;
  }
  meta.textContent=`${extItems.length} 条，来自${S.lang==='both'?'中英文维基':'维基百科'}`;
  POOL.clear();
  extItems.forEach(it=>POOL.set(it.id,it));
  localResults().forEach(it=>POOL.set(it.id,it));
  box.innerHTML=extItems.map(it=>{
    const d=FAVS.some(f=>f.id===it.id);
    return `<article class="card extcard" data-id="${esc(it.id)}">
      <div>
        <h3 data-act="open">${esc(it.t)}</h3>
        <p>${esc(it.s)}</p>
        <div class="src">${esc(it.r)}${it.y!=null?' · 约 '+fmtY(it.y):''} · <a href="${esc(it.url)}" target="_blank" rel="noopener">原文</a></div>
      </div>
      <div class="acts"><button class="mini${d?' on':''}" data-act="fav">${d?'已收藏':'收藏'}</button></div>
    </article>`;
  }).join('');
}

const WORKER_CODE = `export default {
  async fetch(req) {
    const u = new URL(req.url);
    const target = u.searchParams.get("url");
    if (!target) return new Response("missing url", { status: 400 });
    if (!/^https:\\/\\/[a-z.]*wikipedia\\.org\\//.test(target))
      return new Response("not allowed", { status: 403 });
    const r = await fetch(target, { headers: { "User-Agent": "history-search/1.0" } });
    const h = new Headers(r.headers);
    h.set("Access-Control-Allow-Origin", "*");
    h.set("Cache-Control", "public, max-age=86400");
    return new Response(r.body, { status: r.status, headers: h });
  }
}`;

/*
 * 自绘滑块：不依赖原生 input[type=range]。
 * 原生 range 在带 backdrop-filter 的滚动容器里、或页面有缩放时，
 * 命中区域容易偏移（点上去没反应、拖动不跟手），用指针坐标自己算百分比最稳。
 */
let scrimSaveT=null;
function bindSlider(el, {get, set, min=0, max=100}){
  const fill=el.querySelector('.slider-fill');
  const knob=el.querySelector('.slider-knob');
  const clamp=v=>Math.max(min, Math.min(max, v));
  const paint=v=>{
    v=clamp(v);
    fill.style.width=v+'%';
    knob.style.left=v+'%';
    el.setAttribute('aria-valuenow', Math.round(v));
  };
  paint(get());

  const pctAt=e=>{
    const r=el.getBoundingClientRect();
    if(!r.width) return get();
    return Math.round(Math.min(Math.max(e.clientX-r.left, 0), r.width) / r.width * 100);
  };
  let dragging=false;

  const apply=e=>{ const v=clamp(pctAt(e)); paint(v); set(v); };

  el.addEventListener('pointerdown', e=>{
    e.preventDefault();
    dragging=true;
    if(el.setPointerCapture) { try{ el.setPointerCapture(e.pointerId); }catch(_){} }
    apply(e);
  });
  el.addEventListener('pointermove', e=>{ if(!dragging) return; e.preventDefault(); apply(e); });
  el.addEventListener('pointerup', e=>{ dragging=false; });
  el.addEventListener('pointercancel', ()=>{ dragging=false; });
  el.addEventListener('lostpointercapture', ()=>{ dragging=false; });

  el.addEventListener('keydown', e=>{
    const step=e.shiftKey?10:1;
    let v=null;
    if(e.key==='ArrowLeft'||e.key==='ArrowDown')  v=get()-step;
    if(e.key==='ArrowRight'||e.key==='ArrowUp')   v=get()+step;
    if(e.key==='Home') v=0;
    if(e.key==='End')  v=100;
    if(v!==null){ e.preventDefault(); v=clamp(v); paint(v); set(v); }
  });

  // 窗口尺寸变化时不需要重算（百分比布局），但抽屉重新打开时会重新绑定
  return paint;
}

function shrink(file,maxW=1500){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1, maxW/img.width);
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));
        c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function exportJSON(){
  const data={app:'history-search', v:1, exportedAt:new Date().toISOString(), favs:FAVS, notes:NOTES, settings:{bgColor:S.bgColor,accent:S.accent,scrim:S.scrim,external:S.external,lang:S.lang,proxy:S.proxy}};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='history-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('已导出');
}
function importJSON(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(Array.isArray(d.favs)){
        const seen=new Set(FAVS.map(x=>x.id));
        d.favs.forEach(x=>{ if(x&&x.id&&!seen.has(x.id)){ FAVS.push(x); seen.add(x.id); } });
        saveFav();
      }
      if(d.notes&&typeof d.notes==='object'){ NOTES=Object.assign({},NOTES,d.notes); saveNotes(); }
      if(d.settings&&typeof d.settings==='object'){ S=Object.assign({},S,d.settings); saveSet(); applyTheme(); }
      render(); openSettings(); toast('导入完成');
    }catch(err){ toast('文件格式不对'); }
  };
  fr.readAsText(f);
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(el && el.dataset.act==='openset'){ e.preventDefault(); openSettings(); return; }
  if(!el) return;
  const act=el.dataset.act;
  if(act==='close'){ closeDrawer(); return; }
  if(act==='more'){ SHOW+=300; render(); return; }

  const card=el.closest('.card');
  const it = card ? POOL.get(card.dataset.id) : (document.body.classList.contains('open') ? curItem : null);

  if(act==='open'&&it){ openDetail(it); return; }
  if(act==='fav'&&it){
    const i=FAVS.findIndex(f=>f.id===it.id);
    if(i>=0){ FAVS.splice(i,1); toast('已取消收藏'); }
    else { FAVS.push(it); toast('已收藏'); }
    saveFav(); render(); if(document.body.classList.contains('open')) refreshFavBtn(it);
    return;
  }
  if(act==='del'&&it){
    FAVS=FAVS.filter(f=>f.id!==it.id); saveFav(); render(); toast('已移除'); return;
  }
  if(act==='copy'&&it){
    try{ await navigator.clipboard.writeText(it.t+'\n'+fmtY(it.y,it.e)+'\n'+(it.s||'')); toast('已复制'); }
    catch(err){ toast('复制失败，请手动选择'); }
    return;
  }
  if(act==='sw'){ /* handled in settings via delegation below */ }

  // settings actions
  const d=$('#drawer');
  if(act==='pickimg'){ $('#imgfile').click(); return; }
  if(act==='clearimg'){ S.bgImage=''; saveSet(); applyTheme(); openSettings(); toast('背景图片已清除'); return; }
  if(act==='copyworker'){
    try{ await navigator.clipboard.writeText(WORKER_CODE); toast('Worker 代码已复制'); }
    catch(err){ toast('复制失败，请手动选择'); }
    return;
  }
  if(act==='testproxy'){ testProxy(); return; }
  if(act==='export'){ exportJSON(); return; }
  if(act==='import'){ $('#jsonfile').click(); return; }
  if(act==='clearfav'){ if(confirm('确定清空全部收藏？')){ FAVS=[]; saveFav(); render(); toast('已清空'); } return; }
  if(act==='reset'){ S.bgImage=''; S.bgColor=DEFAULTS.bgColor; S.accent=DEFAULTS.accent; S.scrim=DEFAULTS.scrim; saveSet(); applyTheme(); openSettings(); toast('已恢复默认'); return; }
});

async function testProxy(){
  const out=$('#testout'); if(!out) return;
  out.textContent='测试中…';
  try{
    const r=await fetch(withProxy(wikiURL('zh','长城')),{signal:AbortSignal.timeout?AbortSignal.timeout(10000):undefined});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();

}

(function loadExtra(){
  // 判断两个标题是不是同一事件（繁简/用字差异，如“赤壁之战”与“赤壁之戰”）
  function near(a,b){
    if(a===b) return true;
    const la=a.length, lb=b.length;
    if(Math.abs(la-lb)>1) return false;
    if(la===lb){
      let d=0;
      for(let i=0;i<la;i++) if(a[i]!==b[i] && ++d>1) return false;
      return d<=1;
    }
    const s = la<lb ? a : b, l = la<lb ? b : a;
    let i=0, j=0, d=0;
    while(i<s.length && j<l.length){
      if(s[i]===l[j]){ i++; j++; continue; }
      if(++d>1) return false;
      j++;
    }
    return true;
  }
  fetch('data/events.json',{cache:'no-cache'})
    .then(r=>r.ok?r.json():null)
    .then(arr=>{
      if(!Array.isArray(arr)||!arr.length) return;
      const byYear=new Map();
      const addIndex=x=>{
        if(x.y==null) return;
        const k=String(x.y);
        if(!byYear.has(k)) byYear.set(k,[]);
        byYear.get(k).push(x.t);
      };
      SEED.forEach(addIndex);
      const titles=new Set(SEED.map(x=>x.t));
      let added=0, skipped=0;
      arr.forEach((x,i)=>{
        if(!x||!x.t) return;
        const sameYear = x.y==null ? [] : (byYear.get(String(x.y))||[]);
        if(titles.has(x.t) || sameYear.some(t=>near(t,x.t))){ skipped++; return; }
        SEED.push({
          id:'x'+i, y:(x.y==null?null:x.y), e:(x.e==null?null:x.e), t:x.t,
          s:x.s||'', c:x.c||'', r:x.r||'', w:x.w||x.t, n:Math.min(x.n||30, 90),
          kind:'event', cf:3, secs:null, tg:[],
          st:[x.t, x.s, x.c, x.r, x.w].join(' ').toLowerCase()
        });
        ALL.push(SEED[SEED.length-1]);
        addIndex(x); titles.add(x.t);
        added++;
      });
      if(!added) return;
      SEED.sort((a,b)=>(a.y==null?9e9:a.y)-(b.y==null?9e9:b.y));
      $('#seedcount').textContent=SEED.length + TRIVIA.length + CUSTOM.length;
      render();
    })
    .catch(()=>{});
})();
</script>
